          includeHTML('#pagination', './partials/common/pagination.html'),
          includeHTML(
            '#officeRentalLevelA',
            './partials/office-rental/office-rental-level-a.html',
          ),
          includeHTML('#contact2', './partials/common/contact.html'),
          includeHTML('#map', './partials/common/map-1.html'),
          includeHTML(
            '#generalInformationLevel',
            './partials/common/general-information-level.html',
          ),
          includeHTML(
            '#ratingProduct',
            './partials/common/rating-product.html',
          ),
          includeHTML('#faqLevel', './partials/common/faq-level.html'),
          includeHTML(
            '#consultingTeam',
            './partials/common/consulting-team.html',
          ),

          includeHTML('#footer', './partials/common/footer.html'),
        ];

        Promise.all(loads).then(() => {
          showHeader();
          initVPChoThue();
          megaSearchEvent();
          resetMegaSearchForm();
        });
      });
    </script>

    <script>
      AOS.init({
        delay: 0,
        duration: 1000,
      });

      // Team Swiper
      function initTeamSwiper() {
        const el = document.querySelector('.team-swiper');

        if (!el) return;

        // chống init trùng
        if (el.classList.contains('swiper-initialized')) return;

        new Swiper(el, {
          slidesPerView: 4,
          spaceBetween: 24,
          // Ensure autoHeight is false (default)
          autoHeight: false,
          // This helper ensures all slides are same height
          watchSlidesProgress: true,
          loop: true,
          speed: 800,
          grabCursor: true,

          autoplay: {
            delay: 3500,
            disableOnInteraction: false,
            pauseOnMouseEnter: true,
          },

          breakpoints: {
            0: { slidesPerView: 1, spaceBetween: 16 },
            640: { slidesPerView: 2, spaceBetween: 20 },
            1024: { slidesPerView: 3, spaceBetween: 24 },
            1280: { slidesPerView: 4, spaceBetween: 24 },
          },
        });
      }
    </script>

    <script>
      function toggleFullInfo() {
        const fullContent = document.getElementById('info-full');
        const btn = document.getElementById('toggleInfoBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');

        if (fullContent.classList.contains('hidden')) {
          fullContent.classList.remove('hidden');
          btnText.textContent = 'Thu gọn';
          btnIcon.classList.remove('fa-chevron-down');
          btnIcon.classList.add('fa-chevron-up');
          // Scroll to full content
          fullContent.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        } else {
          fullContent.classList.add('hidden');
          btnText.textContent = 'Xem thêm';
          btnIcon.classList.remove('fa-chevron-up');
          btnIcon.classList.add('fa-chevron-down');
          // Scroll back to preview
          document
            .getElementById('info-preview')
            .scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      }
