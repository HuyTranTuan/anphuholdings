<section class="container px-4 py-8" data-aos="fade-up" data-aos-delay="250">
  <!-- Title -->
  <h2 class="mb-4 text-2xl font-bold text-slate-900 md:text-2xl">
    Đánh giá Sản phẩm
  </h2>

  <!-- Rating options with stars -->
  <div class="mb-6 flex flex-wrap items-center gap-4">
    <label
      class="hover:text-gold flex cursor-pointer items-center gap-2 transition-colors"
    >
      <input
        type="radio"
        name="rating"
        value="1"
        class="text-gold focus:ring-navy h-4 w-4 border-gray-300"
      />
      <span class="flex gap-0.5">
        <i class="fas fa-star text-primary"></i>
      </span>
    </label>

    <label
      class="hover:text-gold flex cursor-pointer items-center gap-2 transition-colors"
    >
      <input
        type="radio"
        name="rating"
        value="2"
        class="text-gold focus:ring-navy h-4 w-4 border-gray-300"
      />
      <span class="flex gap-0.5">
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
      </span>
    </label>

    <label
      class="hover:text-gold flex cursor-pointer items-center gap-2 transition-colors"
    >
      <input
        type="radio"
        name="rating"
        value="3"
        class="text-gold focus:ring-navy h-4 w-4 border-gray-300"
      />
      <span class="flex gap-0.5">
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
      </span>
    </label>

    <label
      class="hover:text-gold flex cursor-pointer items-center gap-2 transition-colors"
    >
      <input
        type="radio"
        name="rating"
        value="4"
        class="text-gold focus:ring-navy h-4 w-4 border-gray-300"
      />
      <span class="flex gap-0.5">
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
      </span>
    </label>

    <label
      class="hover:text-gold flex cursor-pointer items-center gap-2 transition-colors"
    >
      <input
        type="radio"
        name="rating"
        value="5"
        class="text-gold focus:ring-navy h-4 w-4 border-gray-300"
      />
      <span class="flex gap-0.5">
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
        <i class="fas fa-star text-primary"></i>
      </span>
    </label>
  </div>

  <!-- Comment Box -->
  <div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
    <label for="comment" class="mb-2 block text-sm font-medium text-slate-700"
      >Nội dung đánh giá</label
    >
    <textarea
      id="comment"
      rows="5"
      placeholder="Chia sẻ trải nghiệm của bạn về văn phòng này..."
      class="focus:ring-navy w-full resize-none rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2"
    ></textarea>

    <!-- Form row (removed captcha) -->
    <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-2">
      <!-- Name -->
      <div>
        <label
          for="name"
          class="mb-1.5 block text-xs font-medium text-slate-700"
          >Họ và tên</label
        >
        <input
          id="name"
          type="text"
          placeholder="Nhập họ và tên của bạn"
          class="focus:ring-navy w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2"
        />
      </div>

      <!-- Email -->
      <div>
        <label
          for="email"
          class="mb-1.5 block text-xs font-medium text-slate-700"
          >Email</label
        >
        <input
          id="email"
          type="email"
          placeholder="Nhập email của bạn"
          class="focus:ring-navy w-full rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm focus:outline-none focus:ring-2"
        />
      </div>
    </div>

    <!-- Submit -->
    <div class="mt-5 flex justify-end">
      <button
        class="from-navy to-navy-light hover:from-navy hover:to-navy-light rounded-lg bg-gradient-to-r px-8 py-3 text-sm font-bold text-white transition-all hover:shadow-lg"
      >
        <i class="fas fa-paper-plane mr-2"></i>Gửi đánh giá
      </button>
    </div>
  </div>
</section>
