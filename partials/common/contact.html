            viewBox="0 0 24 24"

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            ></path>
          </svg>
        </button>

      <div

            <input

              placeholder="Email *"
              class="w-full rounded-lg border-none p-4"

              type="tel"
              placeholder="Số điện thoại *"
              class="w-full rounded-lg border-none p-4"
            />

          <div>
            <select class="w-full rounded-lg border-none p-4 text-secondary">
              <option>Khu vực tìm kiếm văn phòng</option>
              <option>Quận 1</option>
              <option>Quận 3</option>
            </select>
          </div>

          <div>
            <textarea
              rows="4"
              placeholder="Yêu cầu khác nếu có"
              class="w-full rounded-lg border-none p-4"
            ></textarea>

            <input
              type="checkbox"
              id="captcha"
              class="h-5 w-5 rounded text-primary"
            />

            <img

              alt="Recaptcha"
            />
