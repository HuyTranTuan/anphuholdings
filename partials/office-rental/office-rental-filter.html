<!-- filter -->
<div class="container overflow-hidden px-4 py-8">
  <!-- Bộ lọc cố định khi scroll (có thể thêm sticky sau) -->
  <div
    class="space-y-4 rounded-2xl border border-gray-300 bg-white p-6 shadow-md"
  >
    <!-- Slider diện tích -->
    <div>
      <h3 class="mb-3 text-lg font-bold">Diện tích Quận 1</h3>
      <span class="mb-2 block text-sm font-medium text-secondary"
        >Diện tích (m²)</span
      >
      <div id="areaSlider"></div>
      <div class="mt-2 text-sm text-gray-600">
        Từ <span id="areaMinVal">0</span> m² đến
        <span id="areaMaxVal">0</span> m²
      </div>
    </div>

    <!-- Slider giá thuê -->
    <div>
      <h3 class="mb-3 text-lg font-bold">Giá thuê Quận 1</h3>
      <span class="mb-2 block text-sm font-medium text-secondary"
        >Giá thuê ($/m²/tháng)</span
      >
      <div id="priceSlider"></div>
      <div class="mt-2 text-sm text-gray-600">
        Từ $<span id="priceMinVal">0</span> đến $<span id="priceMaxVal">0</span>
      </div>
    </div>

    <!-- Hạng văn phòng -->
    <div class="space-y-4">
      <div>
        <h3 class="mb-3 text-lg font-bold">Hạng văn phòng Quận 1</h3>
        <div class="flex flex-wrap justify-between gap-2 text-sm">
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Hạng A
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Hạng B
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Hạng C
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Giá rẻ
          </button>
        </div>
      </div>

      <div>
        <h3 class="mb-3 text-lg font-bold">Hướng Quận 1</h3>
        <div class="flex flex-wrap justify-between gap-3 text-sm">
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Đông
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Tây
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Nam
          </button>
          <button
            class="rounded-full border border-gray-300 px-4 py-2 hover:bg-blue-50"
          >
            Bắc
          </button>
        </div>
      </div>

      <div>
        <h3 class="mb-3 text-lg font-bold">Phường mới Quận 1</h3>
        <select
          class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option>Chọn phường</option>
          <option>Phường Bến Nghé</option>
          <option>Phường Đa Kao</option>
          <!-- thêm các phường khác -->
        </select>
      </div>

      <div>
        <h3 class="mb-3 text-lg font-bold">Đường Quận 1</h3>
        <select
          class="w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option>Chọn đường</option>
          <option>Tôn Đức Thắng</option>
          <option>Lê Duẩn</option>
          <option>Hai Bà Trưng</option>
          <!-- thêm đường khác -->
        </select>
      </div>
    </div>

    <button
      class="w-full rounded-xl border border-secondary bg-white py-4 font-bold text-secondary transition hover:border-primary hover:text-primary"
    >
      Đặt lại
    </button>
  </div>
</div>
